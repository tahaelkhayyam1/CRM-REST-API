<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>

<button onclick="registerUser()">Register</button>

<script>
function registerUser() {
    fetch("http://localhost/clientflow-api/public/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: "Taha",
            email: "taha@test.com",
            password: "123456"
        })
    })
    .then(res => res.json())
    .then(data => console.log(data))
    .catch(err => console.log(err));
}
</script>

</body>
</html>
